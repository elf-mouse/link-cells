<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkCells - 全球网站聚合分享</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
</head>
<body>
    <header class="top-nav">
        <div class="logo">LinkCells</div>
    </header>

    <main class="content-wrapper">
        <aside class="sidebar">
            <nav id="category-tree"></nav>
        </aside>

        <section class="main-content">
            <div class="content-header">
                <h2>网站列表</h2>
                <button id="view-toggle-button" class="md3-button">
                    <span class="material-icons">grid_view</span>
                    <span class="button-text">切换为时间轴</span>
                </button>
            </div>
            <div id="website-container" class="grid-view">
                <!-- Website cards will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
