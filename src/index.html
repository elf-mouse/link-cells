<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkCells</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
</head>
<body>
    <header class="top-nav">
        <button id="menu-button" class="icon-button">
            <span class="material-icons">menu</span>
        </button>
        <div class="logo">LinkCells</div>
        <div class="search-box">
            <span class="material-icons">search</span>
            <input type="text" id="search-input" placeholder="Search...">
        </div>
    </header>

    <div id="scrim-overlay"></div>

    <main class="content-wrapper">
        <aside id="sidebar" class="sidebar">
            <nav id="category-tree"></nav>
        </aside>

        <section class="main-content">

            <div id="website-container" class="grid-view">
                <!-- Website cards will be dynamically loaded here -->
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
